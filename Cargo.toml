[package]
name = "mh"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A minimal native Rust coding harness based on Pi"
license = "MIT"

[dependencies]
base64 = "=0.22.1"
clap = { version = "=4.5.51", features = ["derive"] }
crossterm = { version = "=0.28.1", features = ["event-stream"] }
dirs = "=6.0.0"
futures-util = "=0.3.31"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ignore = "=0.4.24"
httpdate = "=1.0.3"
jsonschema = { version = "=0.62.0", default-features = false }
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "creation-flags", "job-object", "kill-on-drop", "process-group"] }
pulldown-cmark = "=0.13.0"
ratatui = { version = "=0.29.0", features = ["unstable-rendered-line-info"] }
schemars = "=0.8.22"
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.145"
serde_path_to_error = "=0.1.20"
serde-saphyr = "=1.3.0"
sha2 = "=0.10.9"
similar = "=2.7.0"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["full"] }
tokio-util = "=0.7.17"
tui-textarea = "=0.7.0"
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.12.0"
unicode-width = "=0.2.0"
url = "=2.5.7"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = "=0.7.0"
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
same-file = "=1.0.6"

[dev-dependencies]
tempfile = "=3.23.0"
tokio = { version = "=1.48.0", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
strip = true
